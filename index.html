<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>타원 초점 맞추기 게임</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; background: #f8f9fa; font-family: 'Pretendard', sans-serif; color: #333; }
        canvas { background: #fff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); cursor: default; touch-action: none; }
        .ui { margin-top: 20px; text-align: center; }
        button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 8px; background: #3498db; color: white; cursor: pointer; transition: 0.2s; margin: 5px; }
        button:hover { background: #2980b9; }
        .score-box { font-size: 20px; font-weight: bold; margin: 10px; color: #2c3e50; min-height: 30px; }
    </style>
</head>
<body>
    <h1>타원의 초점을 찾아라</h1>
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    
    <div class="ui">
        <div id="result" class="score-box"></div>
        <button onclick="checkAnswer()">결과 확인</button>
        <button onclick="initGame()" style="background: #95a5a6;">새로운 타원</button>
        <p>빨간 점 두 개를 드래그해서 초점 위치에 놓으세요.</p>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let ellipse = {};
        let foci = [];
        let playerPoints = [];
        let draggingIdx = -1; // 현재 드래그 중인 점의 인덱스

        function initGame() {
            document.getElementById('result').innerHTML = '';
            draggingIdx = -1;

            const minA = 120; // 최소 장반경
            const maxA = 200; // 최대 장반경

            const a = Math.random() * (maxA - minA) + minA; // 장반경 결정
            const b = Math.random() * (a - 60) + 30; // 단반경 결정

           ellipse = {
                cx: Math.random() * 200 + 300, // 300~500 사이 (중앙 근처)
                cy: Math.random() * 100 + 200, // 200~300 사이
                a: a,
                b: b,
                rotation: Math.random() * Math.PI
            };
        
            const cSquared = Math.max(0, ellipse.a**2 - ellipse.b**2);
            const c = Math.sqrt(cSquared);
    
            foci = [-c, c].map(localX => ({
                x: ellipse.cx + localX * Math.cos(ellipse.rotation),
                y: ellipse.cy + localX * Math.sin(ellipse.rotation)
            }));
        
            // 플레이어 점을 타원 밖 멀리 배치해서 직접 옮기게 유도
            playerPoints = [
                { x: 50, y: 50 },
                { x: 120, y: 50 }
            ];
        
            draw();
        }

        function draw(showAnswer = false) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 타원 그리기
            ctx.beginPath();
            ctx.ellipse(ellipse.cx, ellipse.cy, ellipse.a, ellipse.b, ellipse.rotation, 0, 2 * Math.PI);
            ctx.strokeStyle = '#3498db';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 정답 표시 (확인 버튼 눌렀을 때만)
            if (showAnswer) {
                foci.forEach(f => {
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#2ecc71';
                    ctx.fill();
                });
            }

            // 플레이어 점 그리기
            playerPoints.forEach((p, idx) => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
                ctx.fillStyle = (draggingIdx === idx) ? '#c0392b' : '#e74c3c';
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
        }


        // --- 마우스/터치 통합 드래그 로직 (Pointer Events) ---

        canvas.addEventListener('pointerdown', e => {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;
        
            // 포인터 캡처 설정 (마우스가 캔버스를 벗어나도 드래그 유지)
            canvas.setPointerCapture(e.pointerId);
        
            playerPoints.forEach((p, idx) => {
                const dist = Math.hypot(p.x - mx, p.y - my);
                // 모바일은 손가락이 두꺼우므로 판정 범위를 30 정도로 넓히면 좋습니다.
                if (dist < 30) draggingIdx = idx;
            });
        });
        
        window.addEventListener('pointermove', e => {
            if (draggingIdx !== -1) {
                const rect = canvas.getBoundingClientRect();
                playerPoints[draggingIdx].x = e.clientX - rect.left;
                playerPoints[draggingIdx].y = e.clientY - rect.top;
                draw();
            }
        });
        
        window.addEventListener('pointerup', e => {
            if (draggingIdx !== -1) {
                canvas.releasePointerCapture(e.pointerId);
                draggingIdx = -1;
                draw();
            }
        });

        function checkAnswer() {
            draw(true);
        
            const d1 = Math.hypot(playerPoints[0].x - foci[0].x, playerPoints[0].y - foci[0].y);
            const d2 = Math.hypot(playerPoints[1].x - foci[1].x, playerPoints[1].y - foci[1].y);
            const altD1 = Math.hypot(playerPoints[0].x - foci[1].x, playerPoints[0].y - foci[1].y);
            const altD2 = Math.hypot(playerPoints[1].x - foci[0].x, playerPoints[1].y - foci[0].y);
            
            const totalDist = Math.min(d1 + d2, altD1 + altD2);
            
            // 핵심 수정: 타원 장반경(a) 대비 오차 비율로 점수 산정
            // 오차의 합이 장반경의 10%라면 약 85점 정도 나오도록 설계
            let score = Math.max(0, 100 - (totalDist / ellipse.a * 150));
            const displayScore = score.toFixed(1);
            
            let message = score === 100 ? "완벽합니다!🎯" : 
                          score >= 90  ? "훌륭합니다!😲" : 
                          score >= 80  ? "좋습니다!👍" : 
                          "연습이 좀 더 필요할 듯...";
            document.getElementById('result').innerHTML = `점수: ${displayScore}점 (${message})`;
        }

        initGame();
    </script>
</body>
</html>
